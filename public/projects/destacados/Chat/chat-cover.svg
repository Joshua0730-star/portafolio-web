    <rect x="420" y="220" rx="18" ry="18" width="240" height="60" fill="url(#b2)"/>
    <text x="440" y="256" font-family="Geist, Inter, sans-serif" font-size="18" fill="white">Sí, conectado ✓</text>
    <rect x="120" y="310" rx="18" ry="18" width="320" height="60" fill="url(#b1)"/>
    <text x="140" y="346" font-family="Geist, Inter, sans-serif" font-size="18" fill="white">Mensajería cifrada extremo a extremo</text>
