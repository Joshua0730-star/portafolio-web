name: Translate content

# Auto-runs the AI translation pipeline whenever Spanish project sources change
# on main. The job opens a PR with the regenerated `<slug>.en.md` files instead
# of pushing directly, so a human reviews the LLM output before it ships.
#
# Requirements (one-time setup):
# 1. Repo Settings → Actions → General → Workflow permissions:
#    - "Read and write permissions"
#    - "Allow GitHub Actions to create and approve pull requests" ✅
# 2. Repo Settings → Secrets → Actions → add GEMINI_API_KEY

on:
  push:
    branches: [main]
    paths:
      - "src/content/projects/*.md"
      - "!src/content/projects/*.en.md"
      - "scripts/translate-content.mjs"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate everything (overwrite existing .en.md)"
        type: boolean
        default: false

# Token scopes the workflow needs.
permissions:
  contents: write
  pull-requests: write

# Avoid two concurrent translation jobs racing for the same PR branch.
concurrency:
  group: translate-content
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify Gemini API key is set
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not configured. Add it at Settings → Secrets → Actions."
            exit 1
          fi

      - name: Run translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            pnpm translate:force
          else
            pnpm translate
          fi

      - name: Check for translation changes
        id: changes
        run: |
          if git diff --quiet -- 'src/content/projects/*.en.md'; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No translation changes detected. Skipping PR creation."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # Pass the token explicitly. The default GITHUB_TOKEN works only if
          # the repo allows Actions to create PRs (see header comment).
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(i18n): regenerate AI translations"
          title: "chore(i18n): regenerate AI translations"
          body: |
            Auto-generated by `scripts/translate-content.mjs` (Gemini).

            Please review each `.en.md` for tone and accuracy before merging.

            Triggered by: ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || github.event.head_commit.message }}
          branch: chore/auto-translate
          base: main
          add-paths: |
            src/content/projects/*.en.md
          delete-branch: true
          labels: |
            i18n
            automated
