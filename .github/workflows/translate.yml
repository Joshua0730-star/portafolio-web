name: Translate content

# Auto-runs the AI translation pipeline whenever Spanish project sources change
# on main. The job opens a PR with the regenerated `<slug>.en.md` files instead
# of pushing directly, so a human reviews the LLM output before it ships.

on:
  push:
    branches: [main]
    paths:
      - "src/content/projects/*.md"
      - "!src/content/projects/*.en.md"
      - "scripts/translate-content.mjs"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate everything (overwrite existing .en.md)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            pnpm translate:force
          else
            pnpm translate
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(i18n): regenerate AI translations"
          title: "chore(i18n): regenerate AI translations"
          body: |
            Auto-generated by `scripts/translate-content.mjs` (Gemini).
            Please review each `.en.md` for tone and accuracy before merging.
          branch: chore/auto-translate
          add-paths: |
            src/content/projects/*.en.md
          delete-branch: true
